experiment:
  name: wildfire_resnet18_baseline
  seed: 42
  output_dir: outputs/wildfire_resnet18_baseline

data:
  root_dir: data
  train_split: train
  val_split: valid
  test_split: test
  image_size: 224
  batch_size: 32
  num_workers: 0

model:
  name: resnet18
  num_classes: 2
  pretrained: false
  dropout: 0.2

training:
  epochs: 5
  lr: 0.0003
  weight_decay: 0.0001
  device: cpu

