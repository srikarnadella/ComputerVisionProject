experiment:
  name: wildfire_small_cnn
  seed: 42
  output_dir: outputs/wildfire_small_cnn

data:
  root_dir: data
  train_split: train
  val_split: valid
  test_split: test
  image_size: 224
  batch_size: 32
  num_workers: 0

model:
  name: small_cnn
  num_classes: 2
  dropout: 0.2

training:
  epochs: 5
  lr: 0.001
  weight_decay: 0.0001
  device: cpu
